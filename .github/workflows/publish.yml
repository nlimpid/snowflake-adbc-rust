name: publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "Set the CARGO_REGISTRY_TOKEN secret to a crates.io API token."
            exit 1
          fi
          publish() {
            echo "publishing $1"
            cargo publish -p "$1" --token "${CARGO_REGISTRY_TOKEN}"
            # The sparse index needs a moment before the next crate can depend on this one.
            sleep 25
          }
          publish snowflake-core
          publish snowflake-arrow
          publish snowflake-adbc
          publish snowflake-adbc-ffi
