name: publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set."
            exit 1
          fi
          publish() {
            local crate="$1"
            local version
            version="$(cargo metadata --format-version 1 --no-deps | python3 -c "import json,sys; name=sys.argv[1]; pkgs=json.load(sys.stdin)['packages']; print(next(p['version'] for p in pkgs if p['name']==name))" "$crate")"
            local code
            code="$(curl -sS -o /dev/null -w "%{http_code}" -A "snowflake-adbc-rust" "https://crates.io/api/v1/crates/${crate}/${version}")"
            if [ "$code" = "200" ]; then
              echo "${crate} ${version} is already on crates.io"
              return 0
            fi
            echo "publishing ${crate} ${version}"
            cargo publish -p "$crate" --token "${CARGO_REGISTRY_TOKEN}"
            sleep 25
          }
          publish snowflake-core
          publish snowflake-arrow
          publish snowflake-adbc
          publish snowflake-adbc-ffi
