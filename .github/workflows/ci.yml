name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, azure, gcp]
        rust: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: fmt, clippy, build
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build --workspace
      - name: test
        env:
          PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
        run: |
          enc="ci/parameters/parameters_${{ matrix.cloud }}.json.gpg"
          if [ -n "${PARAMETERS_SECRET:-}" ] && [ -f "$enc" ]; then
            # shellcheck disable=SC1091
            source ci/scripts/decrypt_parameters.sh "${{ matrix.cloud }}"
            export SNOWFLAKE_TEST_REQUIRED=1
          else
            echo "no parameters for ${{ matrix.cloud }}; real-account tests skip"
          fi
          cargo test --workspace
